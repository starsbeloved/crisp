<!doctype html><html lang="en"><meta charset="UTF-8"><title>Local face session smoke test</title><h1>Face session worker smoke test</h1><p>Read-only connection test. No camera, biometric enrollment, or provider calls.</p><button id="run">Test shared session connection</button><output id="result" role="status">Not run</output><script type="module">
import {connectVisionSession} from '/client/vision/session-client.ts';
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#result');let first,second;try{first=connectVisionSession();second=connectVisionSession();const states=await Promise.all([first.request({kind:'read',mode:'kiosk'}),second.request({kind:'read',mode:'kiosk'})]);output.textContent=states[0].revision===states[1].revision?'PASS · two real SharedWorker ports returned the authorized session revision; no biometric data displayed':'FAIL · inconsistent revisions';}catch(error){output.textContent=error.message==='Vision session expired or unauthorized. Reconnect the station.'?'PASS · real SharedWorker replied; backend authorization denied the read · authorized cross-tab enrollment still requires device testing':'FAIL · '+error.message;}finally{first?.dispose();second?.dispose();}};
</script></html>
