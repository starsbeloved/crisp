<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Local face worker smoke test</title></head><body><h1>Face worker smoke test</h1><p>No camera, no people and no provider calls. A generated blank canvas tests the real model path only.</p><button id="run">Run local model smoke test</button><output id="result" role="status">Not run</output><script type="module">
import {createFaceWorkerAdapter} from '/client/vision/worker-adapter.ts';
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#result');let adapter=null,image=null,backend='unknown';try{output.textContent='Loading hash-verified models';const worker=new Worker(new URL('../client/vision/face.worker.ts',import.meta.url),{type:'module'});worker.addEventListener('message',event=>{if(event.data.stage)output.textContent=event.data.stage;if(event.data.backend)backend=event.data.backend;});adapter=createFaceWorkerAdapter(worker);await adapter.ready();const canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;const ctx=canvas.getContext('2d');ctx.fillStyle='#777';ctx.fillRect(0,0,320,240);image=await createImageBitmap(canvas);const times=[];let faces=[];for(let i=0;i<3;i++){const started=performance.now();faces=await adapter.detect(image,{width:320,height:240,sourceAtMs:started});times.push(Math.round(performance.now()-started));}output.textContent=`PASS · actual detector, landmark and 128D descriptor kernels loaded · ${backend} · blank-frame detections ${faces.length} · inference ${times.join(', ')} ms · no real-face validation`;}catch(e){output.textContent='FAIL · '+e.message;}finally{image?.close();adapter?.dispose();}};
</script></body></html>
